name: VPC (Terragrunt)
run-name: "VPC ${{ inputs.action == 'plan' && 'PLAN' || inputs.action == 'apply' && 'APPLY' || 'DESTROY' }} by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Akcija'
        required: true
        type: choice
        options: [plan, apply, destroy]
      confirm_destroy:
        description: 'Za destroy ukucaj: platform'
        required: false
        type: string

env:
  AWS_REGION: eu-central-1
  TG_DIR: infrastructure-live/vpc
  TF_VERSION: "1.15.6"
  TG_VERSION: "1.0.8"

permissions:
  contents: read
  id-token: write

jobs:
  vpc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TG_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure git for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.MODULES_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false   # vazno: Terragrunt poziva terraform direktno

      - name: Setup Terragrunt
        run: |
          curl -sL https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64 \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Terragrunt plan
        id: plan
        run: |
          if [[ "${{ github.event.inputs.action }}" == "destroy" ]]; then
            terragrunt plan -destroy -no-color 2>&1 | tee plan.txt
          else
            terragrunt plan -no-color 2>&1 | tee plan.txt
          fi

      - name: Terragrunt apply
        if: |
          github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terragrunt apply -auto-approve

      - name: Provera potvrde za destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          if [[ "${{ github.event.inputs.confirm_destroy }}" != "platform" ]]; then
            echo "::error::DESTROY ODBIJEN! Ukucaj: platform"
            exit 1
          fi

      - name: Terragrunt destroy
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.action == 'destroy' &&
          github.event.inputs.confirm_destroy == 'platform'
        run: terragrunt destroy -auto-approve

      - name: Terragrunt output
        if: |
          github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terragrunt output
