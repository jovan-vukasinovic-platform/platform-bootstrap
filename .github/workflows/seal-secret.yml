name: Seal Secret (kubeseal)
run-name: "Seal ${{ inputs.secret_key }} -> ${{ inputs.namespace }}/${{ inputs.secret_name }} by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Namespace u kome ce tajna ziveti'
        required: true
        type: string
      secret_name:
        description: 'Ime tajne (mora se poklapati sa sealedSecret.name u values!)'
        required: true
        type: string
      secret_key:
        description: 'Kljuc tajne (npr. DB_PASSWORD)'
        required: true
        type: string
      secret_value:
        description: 'Vrednost tajne (jedna linija; vidi bezbednosnu napomenu)'
        required: true
        type: string

env:
  AWS_REGION: eu-central-1
  CLUSTER_NAME: platform-eks
  KUBESEAL_VERSION: "0.38.4"  # https://github.com/bitnami/sealed-secrets/releases

permissions:
  contents: read
  id-token: write

jobs:
  seal:
    runs-on: ubuntu-latest

    steps:
      - name: Maskiranje vrednosti tajne
        run: echo "::add-mask::${{ inputs.secret_value }}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Instalacija kubeseal CLI
        run: |
          curl -sSL "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz" \
            | tar -xz kubeseal
          sudo install -m 755 kubeseal /usr/local/bin/kubeseal
          kubeseal --version

      - name: Pecacenje vrednosti tajne
        id: seal
        run: |
          ENCRYPTED=$(printf '%s' '${{ inputs.secret_value }}' | kubeseal --raw \
            --namespace '${{ inputs.namespace }}' \
            --name '${{ inputs.secret_name }}' \
            --from-file=/dev/stdin)
          echo "encrypted=${ENCRYPTED}" >> "$GITHUB_OUTPUT"

      - name: Rezultat zapecacene tajne
        run: |
          echo "## Zapecacena vrednost tajne"
          echo "=============================================================="
          echo "${{ inputs.secret_key }}: ${{ steps.seal.outputs.encrypted }}"
          echo "=============================================================="
